{{ include('admin.html', sandboxed = true) }}
<link rel="stylesheet" type="text/css" href="../assets/icofont.min.css">
<link rel="stylesheet" type="text/css" href="../assets/comun.css">
<link rel="stylesheet" type="text/css" href="../assets/paginas.css">

<form method="post" action="http://localhost/SisAcad2.0/admin/telades">
    <div class="container">

        <table class="table table-dark table-hover">
            <h2>Modalidades</h2>

            <thead class="thead-light">
                <tr> 
                    <th>Nome</th>
                    <th>Valor</th>                    
                    <th colspan="2"> Ações</th>
                </tr>
            </thead>
            <tbody>
                {%for m in modalidades%}
                <tr>
                    <td>{{m.descriModalidade}}</td>
                    <td>{{m.valorModalidade}}</td>

                    <td> <a href="http://localhost/SisAcad2.0/admin/telaEditMod&id={{m.idmodalidades}}" class="btn btn-info" role="button">Edtar</a>
                        <!--<a href="http://localhost/SisAcad2.0/admin/telaEdit&id={{c.idusuario}}" class="btn btn-danger" role="button">Inativar</a>-->
                        <a href="http://localhost/SisAcad2.0/admin/excluirModalidade&id={{m.idmodalidades}}" class="btn btn-danger" role="button">Inativar</a>
                </tr>
                {%endfor%}
                <tr>
            </tbody>
        </table>
    </div>
</form>
