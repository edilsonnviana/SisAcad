
<html lang="en">
    <head>
        <title>SisAcad</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
        <link rel="stylesheet" type="text/css" href="assets/icofont.min.css">
        <link rel="stylesheet" type="text/css" href="assets/comun.css">
        <link rel="stylesheet" type="text/css" href="assets/paginas.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
                    <li class="nav-item active">
                        <a class="navbar-brand" href="http://localhost/SisAcad2.0/dashboard"> <div>
                                <i class="icofont-muscle mr-2" ></i>
                                <span class="font-weight-light">Sis</span>
                                <span class="font-weight-bold">Acad</span>
                                <i class="icofont-gym ml-2"></i>
                            </div></a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="" id="navbardrop" data-toggle="dropdown">
                            Clintes
                        </a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="http:/SisAcad2.0/dashboard/cadCliente">Cadastrar</a>
                            <a class="dropdown-item" href="http:/SisAcad2.0/dashboard/telaCliente">Listar</a>
                        </div>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="http:/SisAcad2.0/dashboard/telaCaixa">Caixa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="http:/SisAcad2.0/dashboard/matriculados">Matriculados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="http:/SisAcad2.0/dashboard/exAlunos">Ex Alunos</a>
                    </li>

                </ul>

                <form class="form-inline my-2 my-lg-0">
                    <div class="btn-group dropleft">
                        <button type="button" class="btn btn-dark dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="icofont-settings-alt"></i>
                        </button>
                        <div class="dropdown-menu">
                            <a   class="dropdown-item" data-toggle="modal" data-target="#myModal">Mudar senha</a>
                        </div>
                    </div>

                    <a href="http:/SisAcad2.0/admin/logout" ><button type="button" class="btn btn-dark">Sair</button></a>
                </form>
            </div>
        </nav>
        <div class="modal fade" id="myModal" role="dialog">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        {{name_user}}   <button type="button" class="close" data-dismiss="modal">&times;</button>

                    </div>
                    <div class="modal-body">
                        <form action="http://localhost/SisAcad2.0/admin/editarSenha" method="post">
                            <div class="form-group">

                                <label for="formGroupExampleInput">Insira senha atual</label>
                                <input type="password" class="form-control" id="formGroupExampleInput" name="senha"   required="required" placeholder="senha atual">
                                <span class="lnr lnr-eye"></span>
                            </div>
                            <div class="form-group">
                                <label for="formGroupExampleInput2">Nova Senha</label>
                                <input type="password" class="form-control" id="formGroupExampleInput2" name="senha1" required="required" placeholder="nova senha">
                            </div>
                            <div class="form-group">
                                <label for="formGroupExampleInput2">Repita nova Senha</label>
                                <input type="password" class="form-control" id="formGroupExampleInput2" name="senha2" required="required" placeholder="repita nova senha">
                            </div>
                            <div class="modal-footer">
                                <button type="submit" class="btn btn-default"  >Salvar</button>
                            </div>
                            <input type="hidden" id="custId" name="id" value="{{id_user}}">
                        </form>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer  class="navbar-fixed-bottom">
            <div class="text-center fixed-bottom">
            <hr>  {{name_user}}     
            </div>
        </footer>
    </body>
</html>
