{{ include('admin.html', sandboxed = true) }}
<link rel="stylesheet" type="text/css" href="../assets/icofont.min.css">
<link rel="stylesheet" type="text/css" href="../assets/comun.css">
<link rel="stylesheet" type="text/css" href="../assets/paginas.css">
<script src="https://code.jquery.com/jquery-3.1.1.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.quicksearch/2.3.1/jquery.quicksearch.js"></script>


<form>
    <div class="container">

        <table class="table table-dark table-hover">
            <h2>Funcionarios</h2>
            <div class="form-group input-group">
                <input name="consulta" id="txt_consulta" placeholder="Consultar" type="text" class="form-control">
            </div>
            <thead>
                <tr> 
                    <th>Nome</th>
                    <th>Cpf</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Endereço</th>
                    <th>Cargo</th>
                    <th colspan="2"> Ações</th>
                </tr>
            </thead>
            <tbody>
                {%for c in usuarios%}
                <tr>
                    <td>{{c.nomeUsuario}}</td>
                    <td>{{c.cpf}}</td>
                    <td>{{c.telefone}}</td>
                    <td>{{c.email}}</td>
                    <td>{{c.endereco}}</td>
                    <td>{{c.descricao}}</td>
                    {%if c.idusuario == id_user%}
                    <td> <a href="http://localhost/SisAcad2.0/admin/telaEdit&id={{c.idusuario}}" class="btn btn-info" role="button">Edtar</a>
                        <!--<a href="http://localhost/SisAcad2.0/admin/telaEdit&id={{c.idusuario}}" class="btn btn-danger" role="button">Inativar</a>-->
                        <button type="button" class="btn btn-danger" disabled>Desabilitar</button> </td>

                </tr>
                {%else%}
            <td> <a href="http://localhost/SisAcad2.0/admin/telaEdit&id={{c.idusuario}}" class="btn btn-info" role="button">Edtar</a>
                <!--<a href="http://localhost/SisAcad2.0/admin/telaEdit&id={{c.idusuario}}" class="btn btn-danger" role="button">Inativar</a>-->
                <a href="http://localhost/SisAcad2.0/admin/desabilitaFunc&id={{c.idusuario}}" class="btn btn-danger" role="button">Desabilitar</a>

                {%endif%}
                {%endfor%}
            <tr>
                </tbody>
        </table>
    </div>
</form>
  
</div>

<script>

$('input#txt_consulta').quicksearch('table#tabela tbody tr');
</script>
